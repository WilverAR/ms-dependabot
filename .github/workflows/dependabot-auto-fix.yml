name: Dependabot Auto Fix

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

concurrency:
  group: dependabot-auto-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: read

jobs:
  dependabot-analyze:
    name: Analyze Alerts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Submit dependency snapshot (Gradle)
        uses: gradle/actions/dependency-submission@v5

      - name: Fetch Dependabot alerts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          script: |
            const fs = require('fs');

            const alerts = [];
            let requestUrl = `GET /repos/${context.repo.owner}/${context.repo.repo}/dependabot/alerts?state=open&per_page=100`;

            const extractNextUrl = (linkHeader) => {
              if (!linkHeader) return null;
              for (const part of linkHeader.split(',')) {
                const section = part.trim();
                if (!section.includes('rel="next"')) continue;
                const start = section.indexOf('<');
                const end = section.indexOf('>');
                if (start >= 0 && end > start) return section.slice(start + 1, end);
              }
              return null;
            };

            while (requestUrl) {
              const response = await github.request(requestUrl);
              alerts.push(...response.data);
              requestUrl = extractNextUrl(response.headers.link);
            }

            const mapped = alerts.map((alert) => {
              const vuln = alert.security_vulnerability || {};
              const pkg = vuln.package || {};
              const patched = vuln.first_patched_version || {};
              return {
                alert_number: alert.number,
                ecosystem: pkg.ecosystem || null,
                name: pkg.name || null,
                fixed_version: patched.identifier || null,
                severity: alert.security_advisory?.severity || null,
                manifest_path: alert.dependency?.manifest_path || null,
              };
            });

            fs.writeFileSync('dependabot-alerts.json', JSON.stringify(mapped, null, 2));
            core.info(`Alerts captured: ${mapped.length}`);

      - name: Upload alerts artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-alerts-json-${{ github.run_id }}
          path: dependabot-alerts.json

  dependabot-auto-fix:
    name: Apply Fixes
    needs: dependabot-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.engine.outputs.changed }}
      clean: ${{ steps.engine.outputs.clean }}
      strategy: ${{ steps.engine.outputs.strategy }}
      status: ${{ steps.engine.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download alerts artifact
        uses: actions/download-artifact@v4
        with:
          name: dependabot-alerts-json-${{ github.run_id }}
          path: .

      - name: Execute remediation engine
        id: engine
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const alertsPath = 'dependabot-alerts.json';
            const buildFile = 'build.gradle';
            const summaryLines = [];
            const changes = [];

            const isStable = (v) => /^\d+\.\d+\.\d+$/.test(String(v || '').trim());
            const tokenize = (v) => String(v).split(/[.-]/).map((p) => (/^\d+$/.test(p) ? Number(p) : p.toLowerCase()));
            const compareVersions = (a, b) => {
              const ta = tokenize(a);
              const tb = tokenize(b);
              const len = Math.max(ta.length, tb.length);
              for (let i = 0; i < len; i++) {
                const va = ta[i] ?? 0;
                const vb = tb[i] ?? 0;
                if (va === vb) continue;
                if (typeof va === 'number' && typeof vb === 'number') return va - vb;
                return String(va).localeCompare(String(vb));
              }
              return 0;
            };
            const escapeRegex = (v) => String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const parseGA = (name) => {
              const parts = String(name || '').split(':');
              if (parts.length < 2) return null;
              return `${parts[0]}:${parts[1]}`;
            };

            const parseBootVersion = (content) => {
              const m = content.match(/id\s+['"]org\.springframework\.boot['"]\s+version\s+['"]([^'"]+)['"]/);
              return m ? m[1].trim() : null;
            };

            const setBootVersion = (content, nextVersion) =>
              content.replace(
                /(id\s+['"]org\.springframework\.boot['"]\s+version\s+['"])([^'"]+)(['"])/,
                `$1${nextVersion}$3`
              );

            const findBlockRange = (src, regex, useLast = false) => {
              const matches = [...src.matchAll(regex)];
              if (!matches.length) return null;
              const start = useLast ? matches[matches.length - 1].index : matches[0].index;
              const open = src.indexOf('{', start);
              if (open < 0) return null;
              let depth = 0;
              for (let i = open; i < src.length; i++) {
                const ch = src[i];
                if (ch === '{') depth++;
                if (ch === '}') {
                  depth--;
                  if (depth === 0) return { start, open, end: i };
                }
              }
              return null;
            };

            const findBlockInside = (src, outerRange, regex, useLast = false) => {
              if (!outerRange) return null;
              const inner = src.slice(outerRange.start, outerRange.end + 1);
              const matches = [...inner.matchAll(regex)];
              if (!matches.length) return null;
              const start = outerRange.start + (useLast ? matches[matches.length - 1].index : matches[0].index);
              const open = src.indexOf('{', start);
              if (open < 0 || open > outerRange.end) return null;
              let depth = 0;
              for (let i = open; i <= outerRange.end; i++) {
                const ch = src[i];
                if (ch === '{') depth++;
                if (ch === '}') {
                  depth--;
                  if (depth === 0) return { start, open, end: i };
                }
              }
              return null;
            };

            const upsertDependencyManagement = (content, entries) => {
              if (!entries.length) return content;
              let out = content;

              const renderLine = ([ga, version]) => `\t\tdependency '${ga}:${version}'`;

              let depMgmtRange = findBlockRange(out, /dependencyManagement\s*\{/g, true);
              if (!depMgmtRange) {
                const block = [
                  '',
                  'dependencyManagement {',
                  '\tdependencies {',
                  ...entries.map(renderLine),
                  '\t}',
                  '}',
                  '',
                ].join('\n');
                const depsMatch = out.match(/\ndependencies\s*\{/);
                if (depsMatch && typeof depsMatch.index === 'number') {
                  out = out.slice(0, depsMatch.index) + block + out.slice(depsMatch.index);
                } else {
                  out = `${out.trimEnd()}\n${block}`;
                }
                return out;
              }

              let depsRange = findBlockInside(out, depMgmtRange, /dependencies\s*\{/g, true);
              if (!depsRange) {
                const insert = `\n\tdependencies {\n${entries.map(renderLine).join('\n')}\n\t}\n`;
                out = out.slice(0, depMgmtRange.end) + insert + out.slice(depMgmtRange.end);
                return out;
              }

              const toInsert = [];
              for (const [ga, version] of entries) {
                const lineRegex = new RegExp(`dependency\\s+['\"]${escapeRegex(ga)}:[^'\"]+['\"]`);
                if (!lineRegex.test(out)) toInsert.push(renderLine([ga, version]));
              }
              if (!toInsert.length) return out;

              const insert = `\n${toInsert.join('\n')}\n`;
              out = out.slice(0, depsRange.end) + insert + out.slice(depsRange.end);
              return out;
            };

            const upsertForceOverrides = (content, entries) => {
              if (!entries.length) return content;
              let out = content;

              out = out.replace(/resolutionStrategy\.eachDependency\s*\{[\s\S]*?\n\s*\}\s*/g, '');

              const buildscriptRange = findBlockRange(out, /buildscript\s*\{/g, true);
              if (!buildscriptRange) {
                const forces = entries
                  .map(([ga, version]) => `      force '${ga}:${version}'`)
                  .join('\n');
                const block = [
                  'buildscript {',
                  '  configurations.classpath {',
                  '    resolutionStrategy {',
                  forces,
                  '    }',
                  '  }',
                  '}',
                  '',
                ].join('\n');
                return `${block}${out}`;
              }

              let classpathRange = findBlockInside(out, buildscriptRange, /configurations\.classpath\s*\{/g, true);
              if (!classpathRange) {
                const insert = [
                  '',
                  '  configurations.classpath {',
                  '    resolutionStrategy {',
                  ...entries.map(([ga, version]) => `      force '${ga}:${version}'`),
                  '    }',
                  '  }',
                  '',
                ].join('\n');
                out = out.slice(0, buildscriptRange.end) + insert + out.slice(buildscriptRange.end);
                return out;
              }

              let resolutionRange = findBlockInside(out, classpathRange, /resolutionStrategy\s*\{/g, true);
              if (!resolutionRange) {
                const insert = [
                  '',
                  '    resolutionStrategy {',
                  ...entries.map(([ga, version]) => `      force '${ga}:${version}'`),
                  '    }',
                  '',
                ].join('\n');
                out = out.slice(0, classpathRange.end) + insert + out.slice(classpathRange.end);
                return out;
              }

              const addLines = [];
              for (const [ga, version] of entries) {
                const forceRegex = new RegExp(`force\\s+['\"]${escapeRegex(ga)}:[^'\"]+['\"]`);
                if (!forceRegex.test(out)) addLines.push(`      force '${ga}:${version}'`);
              }
              if (!addLines.length) return out;

              const insert = `\n${addLines.join('\n')}\n`;
              out = out.slice(0, resolutionRange.end) + insert + out.slice(resolutionRange.end);
              return out;
            };

            const removeOverridePackage = (content, ga) => {
              const depRegex = new RegExp(`^\\s*dependency\\s+['\"]${escapeRegex(ga)}:[^'\"]+['\"]\\s*\\n?`, 'gm');
              const forceRegex = new RegExp(`^\\s*force\\s+['\"]${escapeRegex(ga)}:[^'\"]+['\"]\\s*\\n?`, 'gm');
              return content.replace(depRegex, '').replace(forceRegex, '');
            };

            const extractOverridePackages = (content) => {
              const out = new Set();
              for (const m of content.matchAll(/dependency\s+['"]([^:'"]+:[^:'"]+):[^'"]+['"]/g)) out.add(m[1]);
              for (const m of content.matchAll(/force\s+['"]([^:'"]+:[^:'"]+):[^'"]+['"]/g)) out.add(m[1]);
              return [...out];
            };

            const applyDirectUpgrades = (content, targetByPackage) => {
              let out = content;
              const applied = [];
              for (const [ga, version] of targetByPackage.entries()) {
                const refRegex = new RegExp(`(['\"])${escapeRegex(ga)}:[^'\"]+\\1`, 'g');
                if (refRegex.test(out)) {
                  out = out.replace(refRegex, `'${ga}:${version}'`);
                  applied.push([ga, version]);
                }
              }
              return { content: out, applied };
            };

            const packageDeclared = (content, ga) => {
              const refRegex = new RegExp(`['\"]${escapeRegex(ga)}:[^'\"]+['\"]`);
              return refRegex.test(content);
            };

            const runValidation = () => {
              try {
                execSync('chmod +x ./gradlew', { stdio: 'inherit' });
                execSync('./gradlew clean build', { stdio: 'inherit' });
                execSync('./gradlew test', { stdio: 'inherit' });
                return { ok: true };
              } catch (error) {
                return { ok: false, error: String(error.message || error) };
              }
            };

            const fetchBootCandidates = async (current) => {
              if (!isStable(current)) return [];
              const [major, minor, patch] = current.split('.').map(Number);
              const url = 'https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-gradle-plugin/maven-metadata.xml';
              try {
                const response = await fetch(url);
                if (!response.ok) return [];
                const xml = await response.text();
                const versions = [...xml.matchAll(/<version>([^<]+)<\/version>/g)]
                  .map((m) => m[1].trim())
                  .filter(isStable)
                  .sort(compareVersions);

                const patchCandidates = versions.filter((v) => {
                  const [ma, mi, pa] = v.split('.').map(Number);
                  return ma === major && mi === minor && pa > patch;
                });
                const minorCandidates = versions.filter((v) => {
                  const [ma, mi] = v.split('.').map(Number);
                  return ma === major && mi > minor;
                });

                const out = [];
                if (patchCandidates.length) out.push({ type: 'boot-patch', version: patchCandidates[patchCandidates.length - 1] });
                if (minorCandidates.length) out.push({ type: 'boot-minor', version: minorCandidates[minorCandidates.length - 1] });
                return out;
              } catch (_e) {
                return [];
              }
            };

            if (!fs.existsSync(alertsPath)) {
              core.setFailed('dependabot-alerts.json was not found.');
              return;
            }
            if (!fs.existsSync(buildFile)) {
              core.setFailed('build.gradle was not found.');
              return;
            }

            const rawAlerts = JSON.parse(fs.readFileSync(alertsPath, 'utf8'));
            const mavenAlerts = rawAlerts
              .filter((a) => a?.ecosystem === 'maven' && a?.name && a?.fixed_version)
              .map((a) => ({ ...a, ga: parseGA(a.name) }))
              .filter((a) => a.ga && isStable(a.fixed_version));

            if (!mavenAlerts.length) {
              fs.writeFileSync('remediation-summary.txt', 'No actionable Maven alerts with stable fixed versions.\n', 'utf8');
              fs.writeFileSync('remediation-state.json', JSON.stringify({ status: 'no-alerts', changed: false, clean: true, strategy: 'none' }, null, 2));
              core.setOutput('status', 'no-alerts');
              core.setOutput('changed', 'false');
              core.setOutput('clean', 'true');
              core.setOutput('strategy', 'none');
              return;
            }

            const targetByPackage = new Map();
            for (const alert of mavenAlerts) {
              const current = targetByPackage.get(alert.ga);
              if (!current || compareVersions(alert.fixed_version, current) > 0) {
                targetByPackage.set(alert.ga, alert.fixed_version);
              }
            }

            const originalContent = fs.readFileSync(buildFile, 'utf8');
            let workingContent = originalContent;
            let selectedStrategy = 'none';
            let clean = false;

            const springPrefixes = [
              'org.springframework',
              'ch.qos.logback',
              'com.fasterxml.jackson',
              'org.apache.tomcat',
              'org.hibernate',
              'io.netty',
              'io.micrometer',
              'org.yaml.snakeyaml',
              'com.h2database',
              'org.postgresql',
              'com.mysql',
              'org.mariadb',
              'com.zaxxer.hikari',
              'org.slf4j',
              'jakarta.validation',
              'jakarta.servlet',
              'jakarta.persistence',
              'org.assertj',
            ];

            const hasSpringManagedAlerts = [...targetByPackage.keys()].some((ga) => {
              const group = ga.split(':')[0];
              return springPrefixes.some((p) => group === p || group.startsWith(`${p}.`));
            });

            const bootVersion = parseBootVersion(workingContent);
            const bootAware = Boolean(bootVersion);

            const tryCandidate = (label, nextContent, strategyTag) => {
              if (nextContent === workingContent) {
                summaryLines.push(`${label}: no changes to apply.`);
                return { accepted: false };
              }
              fs.writeFileSync(buildFile, nextContent, 'utf8');
              summaryLines.push(`${label}: validating...`);
              const result = runValidation();
              if (!result.ok) {
                summaryLines.push(`${label}: build/test failed.`);
                fs.writeFileSync(buildFile, workingContent, 'utf8');
                return { accepted: false };
              }

              summaryLines.push(`${label}: validation OK.`);
              workingContent = nextContent;
              selectedStrategy = strategyTag;
              clean = true;
              return { accepted: true };
            };

            if (bootAware && hasSpringManagedAlerts) {
              const bootCandidates = await fetchBootCandidates(bootVersion);
              for (const candidate of bootCandidates) {
                const next = setBootVersion(workingContent, candidate.version);
                const tried = tryCandidate(
                  `Phase 3 (${candidate.type}) Spring Boot ${bootVersion} -> ${candidate.version}`,
                  next,
                  candidate.type
                );
                if (tried.accepted) {
                  changes.push(`Spring Boot: ${bootVersion} -> ${candidate.version} (${candidate.type})`);
                  break;
                }
              }
            } else {
              summaryLines.push('Phase 3 skipped: project is not Spring Boot aware or no managed-family alerts found.');
            }

            if (!clean) {
              const direct = applyDirectUpgrades(workingContent, targetByPackage);
              if (direct.applied.length) {
                const tried = tryCandidate('Phase 4 (direct upgrades)', direct.content, 'direct-upgrade');
                if (tried.accepted) {
                  for (const [ga, version] of direct.applied) changes.push(`Direct: ${ga} -> ${version}`);
                }
              } else {
                summaryLines.push('Phase 4 skipped: no explicit dependency declarations to update.');
              }
            }

            if (!clean) {
              const missing = [...targetByPackage.entries()].filter(([ga]) => !packageDeclared(workingContent, ga));
              if (missing.length) {
                const next = upsertDependencyManagement(workingContent, missing);
                const tried = tryCandidate('Phase 5A (dependencyManagement overrides)', next, 'dependency-management-override');
                if (tried.accepted) {
                  for (const [ga, version] of missing) changes.push(`dependencyManagement: ${ga} -> ${version}`);
                }
              } else {
                summaryLines.push('Phase 5A skipped: no missing packages for dependencyManagement.');
              }
            }

            if (!clean) {
              const missingForForce = [...targetByPackage.entries()].filter(([ga]) => !packageDeclared(workingContent, ga));
              if (missingForForce.length) {
                const next = upsertForceOverrides(workingContent, missingForForce);
                const tried = tryCandidate('Phase 5B (buildscript resolutionStrategy.force)', next, 'classpath-force-override');
                if (tried.accepted) {
                  for (const [ga, version] of missingForForce) changes.push(`force: ${ga} -> ${version}`);
                }
              } else {
                summaryLines.push('Phase 5B skipped: no missing packages for force overrides.');
              }
            }

            if (clean) {
              const overridePkgs = extractOverridePackages(workingContent);
              if (overridePkgs.length) summaryLines.push(`Cleanup phase: evaluating ${overridePkgs.length} override entries.`);

              for (const ga of overridePkgs) {
                const candidate = removeOverridePackage(workingContent, ga);
                if (candidate === workingContent) continue;
                fs.writeFileSync(buildFile, candidate, 'utf8');
                const result = runValidation();
                if (result.ok) {
                  workingContent = candidate;
                  summaryLines.push(`Cleanup: removed unnecessary override for ${ga}.`);
                } else {
                  fs.writeFileSync(buildFile, workingContent, 'utf8');
                  summaryLines.push(`Cleanup: kept override for ${ga} (still required).`);
                }
              }
            }

            fs.writeFileSync(buildFile, workingContent, 'utf8');

            const changed = workingContent !== originalContent;
            const status = clean ? 'fixed' : 'unresolved';

            if (!changes.length) {
              changes.push('No effective dependency version changes were applied.');
            }

            const summary = [
              `Status: ${status}`,
              `Changed: ${changed}`,
              `Clean: ${clean}`,
              `Strategy: ${selectedStrategy}`,
              '',
              'Applied changes:',
              ...changes.map((c) => `- ${c}`),
              '',
              'Execution log:',
              ...summaryLines.map((l) => `- ${l}`),
              '',
            ].join('\n');

            fs.writeFileSync('remediation-summary.txt', summary, 'utf8');
            fs.writeFileSync(
              'remediation-state.json',
              JSON.stringify({ status, changed, clean, strategy: selectedStrategy, changes }, null, 2)
            );

            core.setOutput('status', status);
            core.setOutput('changed', String(changed));
            core.setOutput('clean', String(clean));
            core.setOutput('strategy', selectedStrategy);

      - name: Create remediation patch artifact
        if: always()
        run: |
          git diff -- build.gradle > dependabot-auto-fix.patch

      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-auto-fix-results-${{ github.run_id }}
          path: |
            build.gradle
            dependabot-auto-fix.patch
            remediation-summary.txt
            remediation-state.json

      - name: Fail when remediation is unresolved
        if: steps.engine.outputs.status == 'unresolved'
        run: |
          echo "Auto-fix could not reach a clean dependency-check result."
          exit 1

  dependabot-create-pr:
    name: Create PR
    needs: dependabot-auto-fix
    if: needs.dependabot-auto-fix.outputs.changed == 'true' && needs.dependabot-auto-fix.outputs.clean == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download auto-fix results artifact
        uses: actions/download-artifact@v4
        with:
          name: dependabot-auto-fix-results-${{ github.run_id }}
          path: .autofix-results

      - name: Prepare changes for PR
        id: prepare
        run: |
          if [ ! -f ".autofix-results/build.gradle" ]; then
            echo "No build.gradle found in auto-fix artifact."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp .autofix-results/build.gradle build.gradle

          if [ -f ".autofix-results/remediation-summary.txt" ]; then
            cp .autofix-results/remediation-summary.txt remediation-summary.txt
          fi

          rm -rf .autofix-results

          if git diff --quiet -- build.gradle; then
            echo "No changes to open PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate clean workspace for PR action
        if: steps.prepare.outputs.changed == 'true'
        run: |
          git status --short
          CHANGED_FILES="$(git diff --name-only)"
          if [ "$CHANGED_FILES" != "build.gradle" ] && [ "$CHANGED_FILES" != $'build.gradle\nremediation-summary.txt' ] && [ "$CHANGED_FILES" != $'remediation-summary.txt\nbuild.gradle' ]; then
            echo "Unexpected files changed before PR creation:"
            echo "$CHANGED_FILES"
            exit 1
          fi

      - name: Create or update auto-fix pull request
        if: steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          base: ${{ github.ref_name }}
          branch: chore/dependabot-auto-fix
          delete-branch: true
          commit-message: 'chore: apply dependabot auto-fix updates'
          title: 'chore: apply dependabot auto-fix updates'
          body-path: remediation-summary.txt
          add-paths: |
            build.gradle
            remediation-summary.txt
