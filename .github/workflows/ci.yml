name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Clean Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build